<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login SITTA UT</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-container">

  <div class="left-panel">
    <img src="img/logo.png" alt="Logo UT">
    <h2>Sistem Informasi Tiras & Transaksi Bahan Ajar</h2>
    <p>Universitas Terbuka. created by : Muhammad Lukmanulhakim</p>
  </div>

  <div class="right-panel">
    <h1>Login SITTA</h1>
    <p>Silakan masuk menggunakan akun terdaftar</p>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Masukkan email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Masukkan password">
    </div>

    <button class="login-btn" onclick="login()">Login</button>

    <div class="extra-links">
      <a href="#">Lupa Password?</a>
      <a href="#">Daftar Akun</a>
    </div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/login.js"></script>

</body>
</html>
